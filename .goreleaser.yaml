version: 2
project_name: vedro
before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: vedro
    dir: .
    main: ./cmd/
    binary: vedro
    env:
      - CGO_ENABLED=0 # build a static binary without C dependencies
    flags:
      - -v
      - -a
    ldflags:
      - -X main.version={{ .Version }} -X main.commit={{ .Commit }}
    goos:
      - darwin
      - freebsd
      - linux
    goarch:
      - amd64
      - arm64

dockers_v2:
  - ids:
      - vedro
    images:
      - ghcr.io/{{ tolower .Env.GITHUB_REPOSITORY_OWNER }}/{{ .ProjectName }}
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser

archives:
  - name_template: "{{ .ProjectName }}-{{ .Version }}.{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats:
      - tar.gz
    wrap_in_directory: true

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}_checksums.txt"
  algorithm: sha256

# Configuration for GitHub Releases
release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: vedro
  footer: |
    ## Docker Images
    - ghcr.io/{{ tolower .Env.GITHUB_REPOSITORY_OWNER }}/{{ .ProjectName }}:{{ .Version }} (universal, multi-platform)
  prerelease: auto
  replace_existing_draft: true
