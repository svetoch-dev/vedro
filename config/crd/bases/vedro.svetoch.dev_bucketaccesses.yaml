apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: bucketaccesses.vedro.svetoch.dev
spec:
  group: vedro.svetoch.dev
  names:
    categories:
    - vedro
    kind: BucketAccess
    listKind: BucketAccessList
    plural: bucketaccesses
    singular: bucketaccess
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bucketRef.name
      name: Bucket
      type: string
    - jsonPath: .spec.principalRef.name
      name: Principal
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BucketAccess grants a CloudPrincipal access to a Bucket through their shared
          ProviderConfig.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the BucketAccess.
            properties:
              access:
                description: Access specifies the desired permission level on the
                  referenced bucket.
                properties:
                  level:
                    description: |-
                      Level selects ObjectReader, ObjectWriter, ObjectAdmin, or BucketAdmin. The selected
                      level is mapped to a provider-specific role on the bucket.
                    enum:
                    - ObjectReader
                    - ObjectWriter
                    - ObjectAdmin
                    - BucketAdmin
                    type: string
                required:
                - level
                type: object
              bucketRef:
                description: |-
                  BucketRef identifies the Bucket on which access is granted. The reference, including its
                  explicit namespace, is immutable. The bucket and principal must reference the same
                  ProviderConfig.
                properties:
                  name:
                    description: Name is the Kubernetes resource name of the Bucket,
                      not its external cloud name.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the Kubernetes namespace containing the Bucket. It must be specified
                      explicitly, including for references within the same namespace.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
                x-kubernetes-validations:
                - message: bucketRef is immutable
                  rule: self == oldSelf
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy controls the grant when this Kubernetes resource is deleted. Delete
                  revokes the recorded permission and is the default. Retain leaves the permission in
                  place. Neither policy deletes the bucket or principal.
                enum:
                - Delete
                - Retain
                type: string
              principalRef:
                description: |-
                  PrincipalRef identifies the CloudPrincipal receiving access, including its explicit
                  namespace. Changing the principal causes the previously recorded grant to be revoked
                  before the new grant is applied.
                properties:
                  name:
                    description: |-
                      Name is the Kubernetes resource name of the CloudPrincipal, not its external cloud name
                      or identifier.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the Kubernetes namespace containing the CloudPrincipal. It must be
                      specified explicitly, including for references within the same namespace.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - access
            - bucketRef
            - principalRef
            type: object
          status:
            description: |-
              Status records the observed state of the BucketAccess and is maintained by the
              controller.
            properties:
              applied:
                description: |-
                  Applied records the external bucket, principal, and permission level from the last
                  successful reconciliation. These values identify the grant to revoke during updates or
                  deletion.
                properties:
                  bucketId:
                    description: |-
                      BucketId is the provider-side bucket identifier used for access management. It may be
                      the same as BucketName.
                    type: string
                  bucketName:
                    description: BucketName is the external name of the bucket on
                      which access was granted.
                    type: string
                  grantedAccess:
                    description: |-
                      GrantedAccess is the Vedro access level last applied to the bucket, rather than the
                      provider-specific role name.
                    type: string
                  principalId:
                    description: PrincipalId is the provider-side identity to which
                      access was granted.
                    type: string
                required:
                - bucketId
                - bucketName
                - grantedAccess
                - principalId
                type: object
              conditions:
