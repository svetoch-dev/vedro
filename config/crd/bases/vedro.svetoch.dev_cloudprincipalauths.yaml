---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: cloudprincipalauths.vedro.svetoch.dev
spec:
  group: vedro.svetoch.dev
  names:
    categories:
    - vedro
    kind: CloudPrincipalAuth
    listKind: CloudPrincipalAuthList
    plural: cloudprincipalauths
    singular: cloudprincipalauth
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.principalRef.name
      name: Principal
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CloudPrincipalAuth provisions authentication for a managed CloudPrincipal and publishes
          or configures its Kubernetes authentication resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the CloudPrincipalAuth.
            properties:
              method:
                description: |-
                  Method selects StaticCredentials to issue cloud credentials into a Secret, or
                  WorkloadIdentity to configure a Kubernetes ServiceAccount. This field is immutable. Only
                  the matching configuration block may be set.
                enum:
                - StaticCredentials
                - WorkloadIdentity
                type: string
                x-kubernetes-validations:
                - message: method is immutable
                  rule: self == oldSelf
              principalRef:
                description: |-
                  PrincipalRef identifies the CloudPrincipal for which authentication is configured,
                  including its explicit namespace. The reference is immutable. The principal must use
                  managementPolicy Managed. Both providers currently support authentication only for
                  ServiceAccount principals.
                properties:
                  name:
                    description: |-
                      Name is the Kubernetes resource name of the CloudPrincipal, not its external cloud name
                      or identifier.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the Kubernetes namespace containing the CloudPrincipal. It must be
                      specified explicitly, including for references within the same namespace.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
                x-kubernetes-validations:
                - message: principalRef is immutable
                  rule: self == oldSelf
              staticCredentials:
                description: |-
                  StaticCredentials configures credential issuance and the output Secret. Required when
                  method is StaticCredentials and forbidden when method is WorkloadIdentity.
                properties:
                  deletionPolicy:
                    default: Retain
                    description: |-
                      DeletionPolicy controls cleanup when CloudPrincipalAuth is deleted. Delete revokes the
                      cloud credentials and allows the managed Secret to be deleted. Retain preserves both the
                      credentials and Secret, removing the Secret's owner references. Defaults to Retain.
                    enum:
                    - Delete
                    - Retain
                    type: string
                  secretRef:
                    description: |-
                      SecretRef names the output Secret in the CloudPrincipalAuth namespace. The controller
                      stores a GCP service account JSON key under credentials.json, or Yandex Cloud S3
                      credentials under AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. The Secret is created and
                      managed by the controller; it is not an input credential Secret.
                    properties:
                      name:
                        description: |-
                          Name is the referenced Kubernetes object name in the CloudPrincipalAuth namespace. The
                          name is immutable.
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: name is immutable
                          rule: self == oldSelf
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
              workloadIdentity:
                description: |-
                  WorkloadIdentity configures the Kubernetes ServiceAccount and cloud identity binding.
                  Required when method is WorkloadIdentity and forbidden when method is StaticCredentials.
                properties:
                  deletionPolicy:
                    default: Retain
                    description: |-
                      DeletionPolicy controls cleanup when CloudPrincipalAuth is deleted. Delete removes the
                      cloud authentication binding and managed ServiceAccount annotation. Retain preserves the
                      configuration. The Kubernetes ServiceAccount itself is not deleted. Defaults to Retain.
                    enum:
                    - Delete
                    - Retain
                    type: string
                  serviceAccountRef:
                    description: |-
                      ServiceAccountRef names an existing Kubernetes ServiceAccount in the CloudPrincipalAuth
                      namespace. For GCP, the controller grants workload identity access to the cloud service
                      account and configures the Kubernetes ServiceAccount annotation. Workload identity for
                      principals is currently unsupported by the Yandex Cloud provider.
                    properties:
                      name:
                        description: |-
                          Name is the referenced Kubernetes object name in the CloudPrincipalAuth namespace. The
                          name is immutable.
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: name is immutable
                          rule: self == oldSelf
                    required:
                    - name
                    type: object
                required:
                - serviceAccountRef
                type: object
            required:
            - method
            - principalRef
            type: object
            x-kubernetes-validations:
            - message: staticCredentials must be set and workloadIdentity must not
                be set when method is StaticCredentials
              rule: self.method != 'StaticCredentials' || (has(self.staticCredentials)
                && !has(self.workloadIdentity))
            - message: workloadIdentity must be set and staticCredentials must not
                be set when method is WorkloadIdentity
              rule: self.method != 'WorkloadIdentity' || (has(self.workloadIdentity)
                && !has(self.staticCredentials))
          status:
            description: |-
              Status records the observed state of the CloudPrincipalAuth and is maintained by the
              controller.
            properties:
              applied:
                description: Applied records the authentication method and resources
                  applied by the controller.
                properties:
                  createdAt:
                    description: |-
                      CreatedAt is the time the controller recorded creation of the current authentication
                      material. It is refreshed when static credentials are recreated and is used to allow for
                      GCP key propagation delays.
                    format: date-time
                    type: string
                  credentialsId:
                    description: |-
                      CredentialsId is the provider-side identifier used to look up or revoke the issued
                      credentials or workload identity binding. Its format depends on the provider and method.
                    type: string
                  method:
                    description: Method is the authentication method applied to the
                      cloud principal.
                    type: string
                  principalId:
                    description: PrincipalId is the provider-side identifier of the
                      cloud principal.
                    type: string
                  secretRef:
                    description: SecretRef identifies the Kubernetes Secret containing
                      static credentials, if any.
                    properties:
                      name:
                        description: Name is the name of the referenced Kubernetes
                          object.
                        type: string
                      namespace:
                        description: Namespace is the namespace of the referenced
                          Kubernetes object.
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  serviceAccountRef:
                    description: ServiceAccountRef identifies the configured Kubernetes
                      ServiceAccount, if any.
                    properties:
                      name:
                        description: Name is the name of the referenced Kubernetes
                          object.
                        type: string
                      namespace:
                        description: Namespace is the namespace of the referenced
                          Kubernetes object.
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                required:
                - createdAt
                - credentialsId
                - method
                - principalId
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the CloudPrincipalAuth state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the latest metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              observedProvider:
                description: ObservedProvider is the ProviderConfig used for the last
                  successful reconciliation.
                type: string
              unsupported:
                description: UnsupportedFeatures lists requested features that the
                  selected provider does not support.
                items:
                  description: |-
                    UnsupportedFeature describes a spec field that cannot be applied by the selected
                    provider.
                  properties:
                    field:
                      description: |-
                        Field is the path to the unsupported field in the requested spec, including a list index
                        when applicable.
                      type: string
                    message:
                      description: Message explains why the selected provider cannot
                        apply the requested feature.
                      type: string
                    reason:
                      description: Reason is a machine-readable code identifying the
                        unsupported capability.
                      type: string
                  required:
                  - field
                  - message
                  - reason
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
