---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: cloudprincipals.vedro.svetoch.dev
spec:
  group: vedro.svetoch.dev
  names:
    categories:
    - vedro
    kind: CloudPrincipal
    listKind: CloudPrincipalList
    plural: cloudprincipals
    singular: cloudprincipal
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.name
      name: Provider
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CloudPrincipal manages or references a cloud identity used for bucket access and
          authentication.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the CloudPrincipal.
            properties:
              kind:
                description: |-
                  Kind selects ServiceAccount, User, Group, Role, or AllUsers. Both providers can manage
                  ServiceAccount and reference ServiceAccount, User, and AllUsers. GCP additionally
                  supports Group references. Role is currently unsupported by both providers.
                  AllUsers represents unauthenticated public access and requires Reference management
                  with both managed and reference omitted.
                enum:
                - ServiceAccount
                - User
                - Group
                - Role
                - AllUsers
                type: string
              managed:
                description: |-
                  Managed supplies the name and deletion policy for an external principal created or
                  reconciled by the controller. Required when managementPolicy is Managed and forbidden
                  otherwise.
                properties:
                  deletionPolicy:
                    default: Delete
                    description: |-
                      DeletionPolicy controls cleanup of the managed external principal when the
                      CloudPrincipal is deleted. Delete removes the external principal and is the default.
                      Retain leaves it in the cloud provider.
                    enum:
                    - Delete
                    - Retain
                    type: string
                  name:
                    description: |-
                      Name is the desired external principal name, subject to provider naming rules. It is
                      required; the API does not default it from metadata.name. For a GCP ServiceAccount, use
                      the short account ID rather than its email address. The resolved name cannot change
                      after provisioning.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              managementPolicy:
                description: |-
                  ManagementPolicy selects Managed to create and reconcile an external principal, or
                  Reference to resolve an existing principal without managing its lifecycle. The policy is
                  immutable. Both providers currently support Managed only for ServiceAccount.
                enum:
                - Managed
                - Reference
                type: string
                x-kubernetes-validations:
                - message: managementPolicy is immutable
                  rule: self == oldSelf
              providerRef:
                description: |-
                  ProviderRef selects the cluster-scoped ProviderConfig used to manage or resolve this
                  principal. The reference is immutable, and the principal must satisfy the provider's
                  usage policy.
                properties:
                  name:
                    description: Name is the name of the cluster-scoped ProviderConfig.
                      No namespace is required.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: providerRef is immutable
                  rule: self == oldSelf
              reference:
                description: |-
                  Reference identifies an existing external principal. Required when managementPolicy is
                  Reference, except for AllUsers, where it must be omitted. Forbidden when
                  managementPolicy is Managed.
                properties:
                  name:
                    description: |-
                      Name identifies an existing external principal in the format expected by the provider
                      and kind. For a GCP ServiceAccount, use its email address. For a Yandex Cloud
                      ServiceAccount, use <folder-name>:<service-account-name>, such as prod:some-sa.
                      User and GCP Group references use email addresses. References are resolved without
                      creating or deleting the external principal.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - kind
            - managementPolicy
            - providerRef
            type: object
            x-kubernetes-validations:
            - message: managed must be set and reference must not be set when managementPolicy
                is Managed
              rule: self.managementPolicy != 'Managed' || (has(self.managed) && !has(self.reference))
            - message: reference must be set unless kind is AllUsers, and managed
                must not be set when managementPolicy is Reference
              rule: self.managementPolicy != 'Reference' || ((self.kind == 'AllUsers'
                || has(self.reference)) && !has(self.managed))
          status:
            description: |-
              Status records the observed state of the CloudPrincipal and is maintained by the
              controller.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the CloudPrincipal state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              externalId:
                description: ExternalId is the provider-side immutable principal identifier.
                type: string
              externalName:
                description: ExternalName is the provider-side principal name.
                type: string
              kind:
                description: Kind is the kind reported for the external principal.
                type: string
              managementPolicy:
                description: ManagementPolicy is the policy used to reconcile the
                  external principal.
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              observedProvider:
                description: ObservedProvider is the ProviderConfig used for the last
                  successful reconciliation.
                type: string
              unsupported:
                description: UnsupportedFeatures lists requested features that the
                  selected provider does not support.
                items:
                  description: |-
                    UnsupportedFeature describes a spec field that cannot be applied by the selected
                    provider.
                  properties:
                    field:
                      description: |-
                        Field is the path to the unsupported field in the requested spec, including a list index
                        when applicable.
                      type: string
                    message:
                      description: Message explains why the selected provider cannot
                        apply the requested feature.
                      type: string
                    reason:
                      description: Reason is a machine-readable code identifying the
                        unsupported capability.
                      type: string
                  required:
                  - field
                  - message
                  - reason
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
