apiVersion: vedro.svetoch.dev/v1alpha1
kind: ProviderConfig
metadata:
  labels:
    app.kubernetes.io/name: vedro
    app.kubernetes.io/managed-by: kustomize
  name: providerconfig-sample-yc
spec:
  type: yc
  projectId: ${YC_PROJECT_ID}
  region: ru-central1
  method: StaticCredentials
  credentialsSecretRef:
    name: yc-creds
    namespace: vedro-system

---
apiVersion: vedro.svetoch.dev/v1alpha1
kind: Bucket
metadata:
  labels:
    app.kubernetes.io/name: vedro
    app.kubernetes.io/managed-by: kustomize
  name: bucket-sample-yc
  namespace: vedro-system
spec:
  providerRef:
    name: providerconfig-sample-yc
  location: ru-central1

  deletionPolicy: Retain
  storageClass: Standard

  versioning:
    enabled: false

  lifecycle:
    rules:
      - enabled: true
        ageDays: 90
        action: Delete

  labels:
    app: payments
    env: dev

  unsupportedFeaturePolicy: Fail
---
apiVersion: vedro.svetoch.dev/v1alpha1
kind: CloudPrincipal
metadata:
  labels:
    app.kubernetes.io/name: vedro
    app.kubernetes.io/managed-by: kustomize
  name: principal-sample-yc
  namespace: vedro-system
spec:
  providerRef:
    name: providerconfig-sample-yc
  kind: ServiceAccount
  managed:
    name: principal-sample-yc
    deletionPolicy: Delete
  managementPolicy: Managed
---
apiVersion: vedro.svetoch.dev/v1alpha1
kind: BucketAccess
metadata:
  labels:
    app.kubernetes.io/name: vedro
    app.kubernetes.io/managed-by: kustomize
  name: access-sample-yc
  namespace: vedro-system
spec:
  principalRef:
    name: principal-sample-yc
    namespace: vedro-system
  bucketRef:
    name: bucket-sample-yc
    namespace: vedro-system
  access:
    level: BucketAdmin
