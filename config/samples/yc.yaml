apiVersion: vedro.svetoch.dev/v1alpha1
kind: ProviderConfig
metadata:
  labels:
    app.kubernetes.io/name: vedro
    app.kubernetes.io/managed-by: kustomize
  name: providerconfig-sample-yc
spec:
  type: yc
  projectId: ${YC_PROJECT_ID}
  region: ru-central1
  method: StaticCredentials
  credentialsSecretRef:
    name: yc-creds
    namespace: vedro-system
  usagePolicy:
    allowedNamespaces:
      names:
        - vedro-system
    bucketPolicy:
      allowedNamePatterns:
        - '^.*sample.*$'
    principalPolicy:
      allowedNamePatterns:
        - '^.*sample.*$'
      allowedReferencePatterns:
        - '.*@svetoch.dev'
        - 'production:.*'
---
apiVersion: vedro.svetoch.dev/v1alpha1
kind: Bucket
metadata:
  labels:
    app.kubernetes.io/name: vedro
    app.kubernetes.io/managed-by: kustomize
  name: bucket-sample-yc
  namespace: vedro-system
spec:
  providerRef:
    name: providerconfig-sample-yc
  location: ru-central1

  deletionPolicy: Delete
  storageClass: Standard

  versioning:
    enabled: false

  lifecycle:
    rules:
      - enabled: true
        ageDays: 90
        action: Delete

  labels:
    app: payments
    env: dev
---
apiVersion: vedro.svetoch.dev/v1alpha1
kind: CloudPrincipal
metadata:
  labels:
    app.kubernetes.io/name: vedro
    app.kubernetes.io/managed-by: kustomize
  name: principal-sample-yc
  namespace: vedro-system
spec:
  providerRef:
    name: providerconfig-sample-yc
  kind: ServiceAccount
  managementPolicy: Managed
  managed:
    name: principal-sample-yc
    deletionPolicy: Delete
---
apiVersion: vedro.svetoch.dev/v1alpha1
kind: BucketAccess
metadata:
  labels:
    app.kubernetes.io/name: vedro
    app.kubernetes.io/managed-by: kustomize
  name: access-sample-yc
  namespace: vedro-system
spec:
  principalRef:
    name: principal-sample-yc
    namespace: vedro-system
  bucketRef:
    name: bucket-sample-yc
    namespace: vedro-system
  access:
    level: ObjectReader
---
apiVersion: vedro.svetoch.dev/v1alpha1
kind: CloudPrincipalAuth
metadata:
  labels:
    app.kubernetes.io/name: vedro
    app.kubernetes.io/managed-by: kustomize
  name: principal-auth-sample-yc
  namespace: vedro-system
spec:
  principalRef:
    name: principal-sample-yc
    namespace: vedro-system
  method: StaticCredentials
  staticCredentials:
    secretRef:
      name: super-secret-yc
    deletionPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: list-bucket-sample-yc
  namespace: vedro-system
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["aws"]
          args:
            - s3
            - ls
            - s3://bucket-sample-yc
            - --recursive
            - --endpoint-url=https://storage.yandexcloud.net
          envFrom:
            - secretRef:
                name: super-secret-yc
          env:
            - name: AWS_DEFAULT_REGION
              value: ru-central1
            - name: AWS_PAGER
              value: ""
