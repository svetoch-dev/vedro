              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the BucketAccess.
            properties:
              access:
                description: Access specifies the desired permission level on the
                  referenced bucket.
                properties:
