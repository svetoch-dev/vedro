apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: providerconfigs.vedro.svetoch.dev
spec:
  group: vedro.svetoch.dev
  names:
    categories:
    - vedro
    kind: ProviderConfig
    listKind: ProviderConfigList
    plural: providerconfigs
    singular: providerconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.method
      name: Method
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProviderConfig is the Schema for the providerconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              If StaticCredentials is set credentialsSecretRef should also be set
              If WorkloadIdentity is set credentialsSecretRef should not be set
            properties:
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef references a Kubernetes Secret containing provider credentials.

                  Required when method is StaticCredentials.
                  Usually empty when method is WorkloadIdentity.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              method:
                description: Method describes the authentication method.
                enum:
                - StaticCredentials
                - WorkloadIdentity
                type: string
              projectId:
                description: |-
                  ProjectID identifies the cloud project/account/folder.

                  For GCP this can be the project ID.
                  For Yandex this can be the folder ID or cloud ID, depending on your design.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: projectId is immutable
                  rule: self == oldSelf
              region:
                type: string
              type:
                description: Type is the cloud provider type.
                enum:
                - gcp
                - yc
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
              usagePolicy:
                description: |-
                  UsagePolicy defines namespace and resource restrictions for this provider.
                  Resources must satisfy all applicable restrictions to reconcile.
                properties:
                  allowedNamespaces:
                    description: |-
                      AllowedNamespaces restricts the namespaces of Bucket, CloudPrincipal,
                      and BucketAccess resources using this provider.
                    properties:
                      all:
                        description: |-
                          All allows every Kubernetes namespace to use this provider.
                          Defaults to false and cannot be combined with a non-empty names list.
                        type: boolean
                      names:
                        description: |-
                          Names lists exact Kubernetes namespace names allowed to use this provider.
                          Must be empty when all is true. If all is false and names is empty,
                          no namespaces are allowed.
                        items:
                          type: string
                        type: array
                    type: object
                  bucketPolicy:
                    description: BucketPolicy restricts cloud bucket names managed
                      through this provider.
                    properties:
                      allowedNamePatterns:
                        description: |-
                          AllowedNamePatterns contains Go regular expressions for cloud bucket names.
                          Checks spec.name, falling back to metadata.name when spec.name is empty.
                          During deletion, the recorded external name is used when available.
                          At least one pattern must match; an empty list allows no names.
                          Use ^ and $ to match the entire name.
                        items:
                          type: string
                        type: array
                    required:
                    - allowedNamePatterns
                    type: object
                  principalPolicy:
                    description: |-
                      PrincipalPolicy restricts principal kinds, management policies, and names
                      used through this provider.
                    properties:
                      allowManaged:
                        default: true
                        description: |-
                          AllowManaged permits CloudPrincipals with managementPolicy Managed.
                          Defaults to true. Kind and name restrictions still apply.
                        type: boolean
                      allowReferences:
                        default: true
                        description: |-
                          AllowReferences permits CloudPrincipals with managementPolicy Reference,
                          including AllUsers. Defaults to true. Kind and applicable reference-name
                          restrictions still apply.
                        type: boolean
                      allowedKinds:
                        default:
                        - ServiceAccount
                        - Role
                        - User
                        - Group
                        - AllUsers
                        description: |-
                          AllowedKinds lists permitted CloudPrincipal kinds for both management
                          policies. Defaults to ServiceAccount, Role, User, Group, and AllUsers.
                          An empty list allows no kinds. Provider capability restrictions still apply.
                          During deletion, the recorded status.kind is checked.
                        items:
                          type: string
                        type: array
                      allowedNamePatterns:
                        description: |-
                          AllowedNamePatterns contains Go regular expressions for managed principal
                          names from spec.managed.name. During deletion, the recorded external name
                          is used when available. At least one pattern must match; an empty list
                          allows no names. Use ^ and $ to match the entire name.
                        items:
                          type: string
                        type: array
                      allowedReferencePatterns:
                        default:
                        - .*
                        description: |-
                          AllowedReferencePatterns contains Go regular expressions for referenced
                          principal names from spec.reference.name. Defaults to [".*"], allowing
                          any reference name. An empty list allows no reference names.
                          Use ^ and $ to match the entire name. AllUsers has no reference name
                          and is exempt from this check.
                        items:
                          type: string
                        type: array
                    required:
                    - allowManaged
                    - allowReferences
                    - allowedKinds
                    - allowedNamePatterns
                    - allowedReferencePatterns
                    type: object
                required:
                - allowedNamespaces
                - bucketPolicy
                - principalPolicy
                type: object
            required:
            - method
            - projectId
            - region
            - type
            - usagePolicy
            type: object
            x-kubernetes-validations:
            - message: credentialsSecretRef is required when method is StaticCredentials
              rule: self.method != 'StaticCredentials' || has(self.credentialsSecretRef)
            - message: credentialsSecretRef must not be set when method is WorkloadIdentity
              rule: self.method != 'WorkloadIdentity' || !has(self.credentialsSecretRef)
          status:
            description: ProviderConfigStatus defines the observed provider configuration
              state.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the ProviderConfig state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the latest metadata.generation
                  observed by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
