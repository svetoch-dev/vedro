                  revokes the recorded permission and is the default. Retain leaves the permission in
                  place. Neither policy deletes the bucket or principal.
                enum:
                - Delete
                - Retain
                type: string
              principalRef:
                description: |-
                  PrincipalRef identifies the CloudPrincipal receiving access, including its explicit
                  namespace. Changing the principal causes the previously recorded grant to be revoked
                  before the new grant is applied.
                properties:
                  name:
                    description: |-
                      Name is the Kubernetes resource name of the CloudPrincipal, not its external cloud name
                      or identifier.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the Kubernetes namespace containing the CloudPrincipal. It must be
                      specified explicitly, including for references within the same namespace.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
