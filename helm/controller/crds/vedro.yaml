                    description: |-
                      Level selects ObjectReader, ObjectWriter, ObjectAdmin, or BucketAdmin. The selected
                      level is mapped to a provider-specific role on the bucket.
                    enum:
                    - ObjectReader
                    - ObjectWriter
                    - ObjectAdmin
                    - BucketAdmin
                    type: string
                required:
                - level
                type: object
              bucketRef:
                description: |-
                  BucketRef identifies the Bucket on which access is granted. The reference, including its
                  explicit namespace, is immutable. The bucket and principal must reference the same
                  ProviderConfig.
                properties:
                  name:
                    description: Name is the Kubernetes resource name of the Bucket,
                      not its external cloud name.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the Kubernetes namespace containing the Bucket. It must be specified
                      explicitly, including for references within the same namespace.
