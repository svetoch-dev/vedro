                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the latest metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              observedProvider:
                description: |-
                  ObservedProvider is the name of the ProviderConfig recorded during successful access
                  reconciliation and used to revoke the grant during deletion.
                type: string
              unsupported:
                description: |-
                  UnsupportedFeatures lists requested access levels that the selected provider does not
