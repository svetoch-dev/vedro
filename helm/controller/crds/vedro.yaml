metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: cloudprincipals.vedro.svetoch.dev
spec:
  group: vedro.svetoch.dev
  names:
    categories:
    - vedro
    kind: CloudPrincipal
    listKind: CloudPrincipalList
    plural: cloudprincipals
    singular: cloudprincipal
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.name
      name: Provider
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CloudPrincipal is the Schema for the cloudprincipals API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the CloudPrincipal.
            properties:
              kind:
                description: Kind identifies the type of cloud principal.
                enum:
                - ServiceAccount
                - User
                - Group
                - Role
                - AllUsers
                type: string
              managed:
                description: |-
                  Managed configures a principal managed by this resource.
                  It must be set only when ManagementPolicy is Managed.
                properties:
                  deletionPolicy:
                    default: Delete
                    description: |-
                      DeletionPolicy controls what happens to the external CloudPrincipal
                      when this Kubernetes object is deleted.
                    enum:
                    - Delete
                    - Retain
                    type: string
                  name:
                    description: |-
                      Name is the cloud provider principal name.
                      Name format depends on what Kind of principal it is
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              managementPolicy:
                description: |-
                  ManagementPolicy controls whether the external principal is managed by this
                  resource or references an existing principal.
                enum:
                - Managed
                - Reference
                type: string
                x-kubernetes-validations:
                - message: managementPolicy is immutable
                  rule: self == oldSelf
              providerRef:
                description: ProviderRef references the ProviderConfig used to manage
                  this principal.
                properties:
                  name:
                    description: Name is the name of the ProviderConfig.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: providerRef is immutable
                  rule: self == oldSelf
              reference:
                description: |-
                  Reference identifies an existing principal that is not managed by this resource.
                  It must be set only when ManagementPolicy is Reference.
                properties:
                  name:
                    description: |-
                      Name is the cloud provider principal name.
                      Name format depends on what Kind of principal it is
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - kind
            - managementPolicy
            - providerRef
            type: object
            x-kubernetes-validations:
            - message: managed must be set and reference must not be set when managementPolicy
                is Managed
              rule: self.managementPolicy != 'Managed' || (has(self.managed) && !has(self.reference))
            - message: reference must be set unless kind is AllUsers, and managed
                must not be set when managementPolicy is Reference
              rule: self.managementPolicy != 'Reference' || ((self.kind == 'AllUsers'
                || has(self.reference)) && !has(self.managed))
          status:
            description: Status defines the observed state of the CloudPrincipal.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the CloudPrincipal state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              externalId:
                description: ExternalId is the provider-side immutable principal identifier.
                type: string
              externalName:
                description: ExternalName is the provider-side principal name.
                type: string
              kind:
                description: Kind is the kind reported for the external principal.
                type: string
              managementPolicy:
                description: ManagementPolicy is the policy used to reconcile the
                  external principal.
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest metadata.generation
                  observed by the controller.
                format: int64
                type: integer
              observedProvider:
                description: ObservedProvider is the ProviderConfig used for the last
                  successful reconciliation.
                type: string
              unsupported:
                description: UnsupportedFeatures lists requested features that the
                  selected provider does not support.
                items:
                  properties:
                    field:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                  required:
                  - field
                  - message
                  - reason
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
