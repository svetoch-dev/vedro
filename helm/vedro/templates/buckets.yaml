{{- range $key, $bucket := .Values.buckets }}
{{- $baseName := default $key $bucket.name }}
{{- $name := $baseName }}
{{- if $bucket.prefixReleaseName }}{{- $name = printf "%s-%s" $.Release.Name $baseName }}{{- end }}
{{- $namespace := default $.Release.Namespace $bucket.namespace }}
{{- $providerName := include "vedro.providerName" (dict "root" $ "ref" $bucket.provider) }}
{{- $location := $bucket.location }}
{{- range $providerKey, $provider := $.Values.providers }}
  {{- if eq $providerName (default $providerKey $provider.name) }}{{- $location = default $provider.region $location }}{{- end }}
{{- end }}
---
apiVersion: vedro.svetoch.dev/v1alpha1
kind: Bucket
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
spec:
  providerRef:
    name: {{ $providerName | quote }}
  location: {{ required (printf "buckets.%s.location is required when the provider has no region" $key) $location | quote }}
  {{- with $bucket.nameOverride }}
  name: {{ . | quote }}
  {{- end }}
  deletionPolicy: {{ default "Retain" $bucket.deletionPolicy | quote }}
  {{- with $bucket.storageClass }}
  storageClass: {{ . | quote }}
  {{- end }}
  {{- if hasKey $bucket "publicAccessPrevention" }}
  publicAccessPrevention: {{ $bucket.publicAccessPrevention }}
  {{- end }}
  {{- with $bucket.versioning }}
  versioning:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- with $bucket.lifecycle }}
  lifecycle:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- with $bucket.labels }}
  labels:
{{ toYaml . | indent 4 }}
  {{- end }}
  {{- with $bucket.cloudSpecificConfig }}
  cloudSpecificConfig:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- range $role, $level := dict "admins" "BucketAdmin" "objAdmins" "ObjectAdmin" "readers" "ObjectReader" "writers" "ObjectWriter" }}
{{- range $principal := index $bucket $role | default list }}
{{- $principalName := required (printf "buckets.%s.%s[].name is required" $key $role) $principal.name }}
{{- $principalNamespace := default $.Release.Namespace $principal.namespace }}
---
apiVersion: vedro.svetoch.dev/v1alpha1
kind: BucketAccess
metadata:
  name: {{ include "vedro.accessName" (dict "bucket" $name "namespace" $principalNamespace "principal" $principalName "level" $level) | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
spec:
  bucketRef:
    name: {{ $name | quote }}
    namespace: {{ $namespace | quote }}
  principalRef:
    name: {{ $principalName | quote }}
    namespace: {{ $principalNamespace | quote }}
  access:
    level: {{ $level | quote }}
  {{- end }}
{{- end }}
{{- end }}
